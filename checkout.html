<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ZFB Pharmaceutical</title>

    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">

</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Header -->

    <section class="products-header">

        <h1>Checkout</h1>

        <p>

            Complete your order securely.

        </p>

    </section>

    <!-- Checkout -->

    <section class="checkout-section">

        <div class="checkout-form">

            <h2>Customer Information</h2>

            <form id="checkoutForm">

                <input type="text" id="customerName" placeholder="Full Name" required>

                <input type="tel" id="customerPhone" placeholder="Phone Number" required>

                <input type="email" id="customerEmail" placeholder="Email Address" required>

                <textarea id="customerAddress" placeholder="Write the exact delivery address" rows="5"
                    required></textarea>

                <button type="button" id="whatsappOrder" class="whatsapp-btn">

                    <i class="fab fa-whatsapp"></i>

                    Order via WhatsApp

                </button>

                <button type="button" id="emailOrder" class="email-btn">

                    <i class="fas fa-envelope"></i>

                    Order via Email

                </button>

            </form>

        </div>

        <div class="order-summary">

            <h2>Your Order</h2>

            <div id="checkoutItems">

                <!-- Products appear here -->

            </div>

            <hr>

            <div class="summary-row">

                <span>Subtotal</span>

                <span id="checkoutSubtotal">
                    $0.00
                </span>

            </div>


            <div class="summary-row total">

                <span>Total</span>

                <span id="checkoutTotal">
                    $0.00
                </span>

            </div>

        </div>

    </section>

    <!--================ FOOTER ================-->
    <div id="footer"></div>
    <script src="js/include.js"></script>
    <script src="js/app.js"></script>
    <script src="js/checkout.js"></script>

</body>

</html>
