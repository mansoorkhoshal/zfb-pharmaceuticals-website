<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | ZFB Pharmaceutical</title>

    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/products.css">

</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- HEADER -->

    <section class="products-header">

        <h1>Premium Healthcare Products</h1>

        <p>

            High-quality pharmaceutical medicines and wellness products.

        </p>

    </section>

    <!-- SEARCH -->

    <section class="search-section">

        <input type="text" id="searchInput" placeholder="Search medicines...">

    </section>

    <!-- FILTERS -->

    <section class="filters">

        <button class="filter-btn active" data-filter="all">

            All

        </button>

        <button class="filter-btn" data-filter="tablet">

            Tablets

        </button>

        <button class="filter-btn" data-filter="capsule">

            Capsules

        </button>

        <button class="filter-btn" data-filter="syrup">

            Syrups

        </button>

        <button class="filter-btn" data-filter="vitamin">

            Vitamins

        </button>

    </section>

    <!-- PRODUCTS -->

    <section>

        <div class="products-grid" id="productsContainer">

            <!-- Products generated by JavaScript -->

        </div>

    </section>

    <!--================ FOOTER ================-->

    <div id="footer"></div>

    <script src="js/include.js"></script>
    <script src="js/app.js"></script>
    <script src="js/products.js"></script>

</body>

</html>
